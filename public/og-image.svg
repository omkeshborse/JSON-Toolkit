    <rect x="240" y="0" width="220" height="52" rx="12" fill="#161C28" stroke="#262D3D" />
    <text x="350" y="32" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#34D399" text-anchor="middle">JSON Validator</text>

    <rect x="480" y="0" width="220" height="52" rx="12" fill="#161C28" stroke="#262D3D" />
    <text x="590" y="32" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#A78BFA" text-anchor="middle">JSON Tree Viewer</text>

    <rect x="720" y="0" width="220" height="52" rx="12" fill="#161C28" stroke="#262D3D" />
    <text x="830" y="32" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#FBBF24" text-anchor="middle">JSON Minifier</text>
  </g>

  <g transform="translate(100, 360)">
    <rect x="0" y="0" width="220" height="52" rx="12" fill="#161C28" stroke="#262D3D" />
