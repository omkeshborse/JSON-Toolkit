<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0D13" />
      <stop offset="100%" stop-color="#121620" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)" />
  <rect x="40" y="40" width="1120" height="550" rx="24" fill="none" stroke="#262D3D" stroke-width="2" />
  
  <!-- Logo Icon Container -->
  <rect x="100" y="140" width="96" height="96" rx="20" fill="#161C28" stroke="#38BDF8" stroke-width="2" />
  <text x="148" y="202" font-family="monospace" font-size="44" font-weight="bold" fill="#38BDF8" text-anchor="middle">{ }</text>

  <!-- Title & Subtitle -->
  <text x="230" y="185" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" fill="#FFFFFF">101 JSON Toolkit</text>
  <text x="230" y="225" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="500" fill="#94A3B8">High-Performance Client-Side Developer Suite</text>

  <!-- Tool Features Pills -->
  <g transform="translate(100, 290)">
    <rect x="0" y="0" width="220" height="52" rx="12" fill="#161C28" stroke="#262D3D" />
