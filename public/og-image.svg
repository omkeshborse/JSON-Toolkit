    <text x="600" y="32" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#2DD4BF" text-anchor="middle">JSON Schema Validator</text>

    <rect x="740" y="0" width="200" height="52" rx="12" fill="#161C28" stroke="#262D3D" />
